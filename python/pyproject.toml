[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facturx-api"
version = "0.1.1"
description = "Python client for the FacturX API: dry run, Factur-X PDF/A-3 conversion, validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
keywords = ["factur-x", "facturx", "en16931", "e-invoicing", "facture-electronique"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.scripts]
facturx = "facturx_api.cli:main"


[project.urls]
Homepage = "https://github.com/facturxapi/sdk"
Source = "https://github.com/facturxapi/sdk/tree/main/python"
Issues = "https://github.com/facturxapi/sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facturx_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
